name: ssh-diag
on:
  workflow_dispatch:
    inputs:
      cmd:
        description: 'Remote command'
        required: true
        default: 'pm2 list && df -h && free -h'

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: bebop
    steps:
      - uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          known_hosts: ${{ vars.SSH_KNOWN_HOSTS }}
      - name: Ensure tirodem pubkey is in authorized_keys
        run: |
          ssh -p ${{ vars.SSH_PORT }} ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} 'grep -qxF "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAXFQGE+BIc6qbV6bSsuuLQh4/kLfaW8dFpqhgvQDk88 tirodem@bebop" ~/.ssh/authorized_keys || echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAXFQGE+BIc6qbV6bSsuuLQh4/kLfaW8dFpqhgvQDk88 tirodem@bebop" >> ~/.ssh/authorized_keys'
      - name: Run remote command
        run: ssh -p ${{ vars.SSH_PORT }} ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} "${{ github.event.inputs.cmd }}"
