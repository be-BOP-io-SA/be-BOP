# Local development infrastructure
# Starts MongoDB and Garage (S3 storage) only (no be-BOP container — use pnpm dev instead)
#
# Usage:
#   docker compose -f docker-compose.dev.yml up -d
#   docker compose -f docker-compose.dev.yml down
services:
  mongo:
    image: mongo:6.0.9
    hostname: mongodb
    command: --replSet rs0 --bind_ip_all
    mem_limit: '5g'
    mem_reservation: '3g'
    healthcheck:
      test: test $$(mongosh --quiet --eval 'try {rs.status().ok} catch(e) {rs.initiate().ok}') -eq 1
      interval: 5s
    ports:
      # Loopback only: this Mongo has no auth, and Docker's publishing bypasses the host firewall.
      - '127.0.0.1:27017:27017'
    volumes:
      - mongo-data:/data/db
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
  # The storage of docker-compose.yml, with the key of .env.local, which be-BOP reads on the host:
  # see docker/storage.sh. Still named minio so that an update replaces the former container.
  minio:
    build:
      dockerfile_inline: |
        FROM dxflrs/garage:v2.2.0 AS garage
        FROM rclone/rclone:1.71.2
        RUN apk add --no-cache bash curl
        COPY --from=garage /garage /usr/local/bin/garage
    hostname: minio
    entrypoint: ['/bin/bash', '/storage.sh']
    ports:
      # Loopback only, like Mongo above.
      - '127.0.0.1:9000:9000'
    environment:
      STORAGE_MODE: development
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: false
    volumes:
      - ./docker/storage.sh:/storage.sh:ro
      - minio-data:/var/lib/minio
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
volumes:
  mongo-data:
  minio-data:
  garage-meta:
  garage-data:
