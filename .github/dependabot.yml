version: 2

updates:
  # Without this file the security scan still runs, but nothing ever opens a pull request —
  # which is how 219 alerts piled up unnoticed.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Enough room for the grouped batches plus a few majors, without burying the PR list.
    open-pull-requests-limit: 10
    groups:
      # Patches and minors are reviewed as one batch: individually they are noise, and a
      # group that fails CI is as easy to bisect as a single bump.
      production:
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        dependency-type: development
        update-types:
          - minor
          - patch
    # Majors stay ungrouped on purpose: each one is a migration that deserves its own review.

  # Actions are pinned to commit SHAs, which nothing else will ever move. Dependabot
  # rewrites the SHA and the version comment next to it; without this entry, pinning
  # would freeze the fixes along with the exposure.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
