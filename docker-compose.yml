services:
  bebop:
    build:
      dockerfile: Dockerfile
    init: true
    ports:
      - 3000:3000
    depends_on:
      mongo:
        condition: service_started
      # Restarted with the storage, which may hand it other S3 settings.
      minio:
        condition: service_started
        restart: true
    # Waits for the storage here, not through a healthcheck, so `up -d` returns at once even during a long move.
    # s3.env is read here because Compose reads env files before the storage writes it.
    command:
      - /bin/bash
      - -c
      - >-
        [ -f /var/lib/storage-handoff/ready ] || echo "waiting for the storage, see: docker compose logs minio";
        until [ -f /var/lib/storage-handoff/ready ]; do sleep 2; done;
        set -a; [ -f /var/lib/storage-handoff/s3.env ] && . /var/lib/storage-handoff/s3.env; set +a;
        exec /app/entrypoint.sh
    environment:
      - MONGODB_URL=${MONGODB_URL:-mongodb://mongodb:27017}
      - ORIGIN=${ORIGIN:-http://localhost:3000}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - PUBLIC_S3_ENDPOINT_URL=${PUBLIC_S3_ENDPOINT_URL:-${S3_ENDPOINT_URL:-http://localhost:9000}}
      - S3_BUCKET=${S3_BUCKET:-bebop}
      - S3_REGION=${S3_REGION:-localhost}
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: true
    volumes:
      - storage-handoff:/var/lib/storage-handoff:ro
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
  mongo:
    image: mongo:6.0.9
    hostname: mongodb
    command: --replSet rs0 --bind_ip_all
    mem_limit: '5g'
    mem_reservation: '3g'
    healthcheck:
      test: test $$(mongosh --quiet --eval 'try {rs.status().ok} catch(e) {rs.initiate().ok}') -eq 1
      interval: 5s
    volumes:
      - mongo-data:/data/db
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
  # Serves Garage, after moving the files of a former install into it: see docker/storage.sh.
  # Still named minio: an update then replaces the former container instead of leaving it running
  # beside this one, and the http://minio:9000 of existing .env.local files keeps working.
  minio:
    build:
      dockerfile_inline: |
        FROM dxflrs/garage:v2.2.0 AS garage
        FROM rclone/rclone:1.71.2
        RUN apk add --no-cache bash curl
        COPY --from=garage /garage /usr/local/bin/garage
    hostname: minio
    entrypoint: ['/bin/bash', '/storage.sh']
    ports:
      - 9000:9000
    environment:
      S3_BUCKET: ${S3_BUCKET:-bebop}
      S3_ENDPOINT_URL: ${S3_ENDPOINT_URL:-http://minio:9000}
      MINIO_SERVER_URL: ${S3_ENDPOINT_URL:-http://localhost:9000}
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: true
    volumes:
      - ./docker/storage.sh:/storage.sh:ro
      - minio-data:/var/lib/minio
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
      - storage-handoff:/var/lib/storage-handoff
    healthcheck:
      test: ['CMD', 'test', '-f', '/var/lib/storage-handoff/ready']
      interval: 5s
      timeout: 5s
      retries: 3
      # Starting, not unhealthy, while the files of a former install are copied.
      start_period: 12h
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
volumes:
  mongo-data:
  minio-data:
  garage-meta:
  garage-data:
  storage-handoff:
