services:
  bebop:
    build:
      dockerfile: Dockerfile
    init: true
    ports:
      - 3000:3000
    depends_on:
      - mongo
      - minio
    # Alternatively:
    # depends_on:
    #   mongo:
    #     condition: service_healthy
    #   minio:
    #     condition: service_started
    # But not needed as bebop takes a while to start up
    environment:
      - MONGODB_URL=${MONGODB_URL:-mongodb://mongodb:27017}
      - ORIGIN=${ORIGIN:-http://localhost:3000}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - PUBLIC_S3_ENDPOINT_URL=${PUBLIC_S3_ENDPOINT_URL:-${S3_ENDPOINT_URL:-http://localhost:9000}}
      - S3_BUCKET=${S3_BUCKET:-bebop}
      - S3_REGION=${S3_REGION:-localhost}
      # No default: the storage is published on 9000, and a known key opens the whole bucket.
      - S3_KEY_ID=${S3_KEY_ID:?set S3_KEY_ID in .env.local, see README}
      - S3_KEY_SECRET=${S3_KEY_SECRET:?set S3_KEY_SECRET in .env.local, see README}
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: true
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
  mongo:
    image: mongo:6.0.9
    hostname: mongodb
    command: --replSet rs0 --bind_ip_all
    mem_limit: '5g'
    mem_reservation: '3g'
    healthcheck:
      test: test $$(mongosh --quiet --eval 'try {rs.status().ok} catch(e) {rs.initiate().ok}') -eq 1
      interval: 5s
    volumes:
      - mongo-data:/data/db
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
  minio:
    image: quay.io/minio/minio:latest
    hostname: minio
    ports:
      - 9000:9000
    environment:
      MINIO_ROOT_USER: ${S3_KEY_ID:?set S3_KEY_ID in .env.local, see README}
      MINIO_ROOT_PASSWORD: ${S3_KEY_SECRET:?set S3_KEY_SECRET in .env.local, see README}
      MINIO_SERVER_URL: ${S3_ENDPOINT_URL:-http://localhost:9000}
    volumes:
      - minio-data:/data
    command: server /data
    env_file:
      - path: .env
        required: true
      - path: .env.local
        required: true
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
volumes:
  mongo-data:
  minio-data:
